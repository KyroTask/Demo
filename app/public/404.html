<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KyroTask Demo</title>
    <script>
      // GitHub Pages SPA redirect
      // Stores the full path in sessionStorage then redirects to index.html
      var base = '/Demo';
      var path = window.location.pathname.replace(base, '') || '/';
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.setItem('spa_redirect', path + search + hash);
      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
